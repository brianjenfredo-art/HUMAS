<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Event Opening</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020811;font-family:Arial,Helvetica,sans-serif}
body{color:#54c9ff;touch-action:manipulation}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:
radial-gradient(circle at center,rgba(0,125,190,.14),transparent 45%),
linear-gradient(135deg,#020812,#041522 55%,#01060b)}
canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.65}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 5px);mix-blend-mode:screen}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.7) 100%)}
.hud{position:absolute;inset:3.5vh 3.5vw;border:1px solid rgba(55,190,255,.25);pointer-events:none}
.hud:before,.hud:after{content:"";position:absolute;width:55px;height:55px;border-color:#31bfff;border-style:solid}
.hud:before{left:-1px;top:-1px;border-width:2px 0 0 2px}
.hud:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}
.corner2,.corner3{position:absolute;width:55px;height:55px;border-color:#31bfff;border-style:solid}
.corner2{right:-1px;top:-1px;border-width:2px 2px 0 0}
.corner3{left:-1px;bottom:-1px;border-width:0 0 2px 2px}
.topbar,.bottombar{position:absolute;left:6vw;right:6vw;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.75}
.topbar{top:6vh}.bottombar{bottom:5vh}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,82vw);text-align:center}
.ring{width:min(300px,42vw);aspect-ratio:1;margin:auto;position:relative;border:1px solid rgba(56,197,255,.5);border-radius:50%;box-shadow:0 0 30px rgba(0,170,255,.15),inset 0 0 35px rgba(0,170,255,.08)}
.ring:before,.ring:after{content:"";position:absolute;inset:12%;border:1px dashed rgba(56,197,255,.5);border-radius:50%;animation:spin 12s linear infinite}
.ring:after{inset:24%;border-style:solid;border-color:rgba(56,197,255,.2);animation:spinReverse 8s linear infinite}
.cross{position:absolute;left:50%;top:50%;width:70%;height:70%;transform:translate(-50%,-50%);border:1px solid rgba(56,197,255,.25);border-radius:50%}
.cross:before,.cross:after{content:"";position:absolute;background:rgba(56,197,255,.35)}
.cross:before{width:100%;height:1px;top:50%;left:0}.cross:after{height:100%;width:1px;left:50%;top:0}
.hand{font-size:min(100px,14vw);line-height:1;position:absolute;left:50%;top:50%;transform:translate(-50%,-53%);filter:drop-shadow(0 0 18px #24bfff);animation:tap 1.25s ease-in-out infinite}
.instruction{margin-top:30px;font-size:clamp(18px,3vw,28px);font-weight:700;letter-spacing:7px;text-shadow:0 0 15px #26bfff}
.sub{margin-top:10px;font-size:11px;letter-spacing:4px;opacity:.65}
#loading,#ready{display:none}
#loading.active,#ready.active{display:block}
.progressWrap{margin:28px auto 0;width:min(560px,75vw)}
.progress{height:6px;border:1px solid rgba(55,200,255,.7);padding:1px}
.fill{height:100%;width:0;background:#48cfff;box-shadow:0 0 18px #2abfff}
.percent{font-size:clamp(44px,8vw,76px);font-weight:800;letter-spacing:5px;margin-top:20px;text-shadow:0 0 25px #21bfff}
.status{font-size:12px;letter-spacing:4px;opacity:.75;margin-top:8px}
.readyMode{color:#5dff9b}
.readyMode .hud{border-color:rgba(70,255,145,.3)}
.readyMode .hud:before,.readyMode .hud:after,.readyMode .corner2,.readyMode .corner3{border-color:#4dff91}
.readyMode .ring{border-color:rgba(75,255,145,.6);box-shadow:0 0 35px rgba(50,255,135,.22),inset 0 0 40px rgba(50,255,135,.1)}
.readyMode .ring:before,.readyMode .ring:after{border-color:rgba(75,255,145,.55)}
.readyMode .cross:before,.readyMode .cross:after{background:rgba(75,255,145,.4)}
.readyMode .instruction,.readyMode .percent{color:#6dffa6;text-shadow:0 0 18px #39ff8b}
.readyMode .fill{background:#55ff9b;box-shadow:0 0 20px #39ff8b}
.fade{animation:fadeIn .6s ease}
@keyframes tap{0%,100%{transform:translate(-50%,-53%)}50%{transform:translate(-50%,-43%)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{to{transform:rotate(-360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:700px){.topbar,.bottombar{font-size:8px;letter-spacing:2px}.hud{inset:2.5vh 2.5vw}.instruction{letter-spacing:4px}}
</style>
</head>
<body>
<div id="app">
<canvas id="particles"></canvas>
<div class="hud"><span class="corner2"></span><span class="corner3"></span></div>
<div class="topbar"><span>AI EVENT CONTROL</span><span id="clock">00:00:00</span></div>
<div class="bottombar"><span>SECURE INTERFACE</span><span>READY / TOUCH INPUT</span></div>
<div class="center" id="standby">
  <div class="ring"><div class="cross"></div><div class="hand">☝</div></div>
  <div class="instruction">SENTUH UNTUK MEMULAI</div>
  <div class="sub">TOUCH TO INITIALIZE EVENT SYSTEM</div>
</div>
<div class="center" id="loading">
  <div class="ring"></div>
  <div class="instruction">SYSTEM INITIALIZING</div>
  <div class="percent" id="percent">0%</div>
  <div class="progressWrap"><div class="progress"><div class="fill" id="fill"></div></div></div>
  <div class="status" id="status">AI CORE ACTIVATING...</div>
</div>
<div class="center" id="ready">
  <div class="ring"></div>
  <div class="instruction">KEGIATAN DIMULAI</div>
  <div class="sub">SYSTEM ONLINE • EVENT INITIALIZED</div>
</div>
<div class="scanlines"></div><div class="vignette"></div>
</div>

<script>
const app=document.getElementById('app'), standby=document.getElementById('standby'),
loading=document.getElementById('loading'), ready=document.getElementById('ready'),
percent=document.getElementById('percent'), fill=document.getElementById('fill'),
status=document.getElementById('status'), clock=document.getElementById('clock');

setInterval(()=>clock.textContent=new Date().toLocaleTimeString('en-GB'),1000);

function fullscreen(){
  const el=document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
}

function startOpening(){
  fullscreen();
  standby.style.display='none';
  loading.classList.add('active','fade');
  const start=performance.now(), duration=2000;
  function tick(now){
    const p=Math.min((now-start)/duration,1);
    const value=Math.floor(p*100);
    percent.textContent=value+'%';
    fill.style.width=value+'%';
    if(value<25) status.textContent='AI CORE ACTIVATING...';
    else if(value<50) status.textContent='LOADING EVENT PROTOCOL...';
    else if(value<75) status.textContent='SYNCHRONIZING HUD SYSTEM...';
    else if(value<100) status.textContent='FINALIZING EVENT SEQUENCE...';
    else status.textContent='SYSTEM READY';
    if(p<1) requestAnimationFrame(tick);
    else setTimeout(()=>{
      loading.style.display='none';
      app.classList.add('readyMode');
      ready.classList.add('active','fade');
      status.textContent='SYSTEM ONLINE';
    },120);
  }
  requestAnimationFrame(tick);
}

document.getElementById('standby').addEventListener('pointerup',startOpening);
document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')startOpening()},{once:true});

// lightweight HUD particles
const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
let w,h,pts=[];
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;pts=Array.from({length:55},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*1.5+.3,v:Math.random()*.35+.05}))}
function draw(){
 ctx.clearRect(0,0,w,h); ctx.fillStyle='rgba(65,195,255,.7)';
 pts.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=h;ctx.fillRect(p.x,p.y,p.s,p.s)});
 requestAnimationFrame(draw);
}
addEventListener('resize',resize);resize();draw();
</script>
</body>
</html>
